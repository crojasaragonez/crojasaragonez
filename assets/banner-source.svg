    </linearGradient>
    <radialGradient id="blue-glow">
      <stop stop-color="#4f8cff" stop-opacity=".19"/>
      <stop offset="1" stop-color="#4f8cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violet-glow">
      <stop stop-color="#7c5cff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2=".25">
      <stop offset=".08" stop-color="#f8fafc"/>
      <stop offset=".7" stop-color="#83adff"/>
      <stop offset="1" stop-color="#4f8cff"/>
    </linearGradient>
    <linearGradient id="line">
      <stop stop-color="#35d6ff"/>
      <stop offset=".5" stop-color="#4f8cff"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="480" rx="2" fill="url(#background)"/>
  <ellipse cx="100" cy="0" rx="720" ry="490" fill="url(#blue-glow)"/>
  <ellipse cx="1170" cy="200" rx="620" ry="510" fill="url(#violet-glow)"/>
  <g fill="none" stroke="#273244" stroke-width="1">
