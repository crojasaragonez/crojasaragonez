<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="title desc">
  <title id="title">Carlos Luis Rojas Aragonés — Technology Entrepreneur</title>
  <desc id="desc">Building AI-native products and the teams behind them. San Carlos, Costa Rica. Dark navy, blue, cyan, and violet design matching crojasaragonez.github.io.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
