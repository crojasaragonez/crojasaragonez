    <text x="56" y="235" font-size="72" font-weight="800" letter-spacing="-2" fill="url(#name)">Rojas Aragonés</text>
    <text x="59" y="300" font-size="28" font-weight="500">Building AI-native products</text>
    <text x="59" y="338" font-size="28" font-weight="500">and the teams behind them.</text>
