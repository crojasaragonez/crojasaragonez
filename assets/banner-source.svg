    <rect x="1058" y="200" width="188" height="188" rx="2" stroke="#7c5cff" stroke-opacity=".35"/>
    <path d="M1006 148h52v52h52" stroke="#35d6ff" stroke-opacity=".6"/>
  </g>
  <g fill="#35d6ff">
